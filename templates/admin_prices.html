<!DOCTYPE html>
<html>
<head>
    <title>Manage Prices - BrandIt Admin</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .btn-save { background: #28a745; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-save:hover { background: #218838; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>💰 Ticket Price Settings</h2>
    
    <form method="POST">
        <div class="form-group">
            <label>Standard Ticket Price ($)</label>
            <input type="number" step="0.01" name="Standard" value="{{ prices['Standard'] }}" required>
        </div>

        <div class="form-group">
            <label>VIP Ticket Price ($)</label>
            <input type="number" step="0.01" name="VIP" value="{{ prices['VIP'] }}" required>
        </div>

        <div class="form-group">
            <label>VVIP Ticket Price ($)</label>
            <input type="number" step="0.01" name="VVIP" value="{{ prices['VVIP'] }}" required>
        </div>

        <button type="submit" class="btn-save">Update Prices</button>
    </form>

    <a href="/admin" class="back-link">← Back to Dashboard</a>
</div>

</body>
</html>
