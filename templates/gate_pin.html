<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; width: 85%; max-width: 350px; border-radius: 20px; text-align: center; border: 2px solid #ff6600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #ff6600; margin: 0 0 5px 0; letter-spacing: 2px; }
        .guest-name { font-size: 1.6rem; font-weight: bold; margin: 15px 0; }
        input { background: #333; border: 1px solid #555; color: white; font-size: 2rem; text-align: center; width: 100%; padding: 10px; border-radius: 10px; margin-bottom: 20px; letter-spacing: 10px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 15px; width: 100%; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="card">
        <h2>VERIFY ID</h2>
        <p style="color: #888; margin-top:0;">{{ ticket_type }} Ticket</p>
        
        <div class="guest-name">{{ guest_name }}</div>
        
        <form action="/gate/verify_pin" method="POST">
            <input type="hidden" name="ticket_code" value="{{ ticket_code }}">
            <input type="tel" name="pin" placeholder="••••" maxlength="4" required autocomplete="off" autofocus>
            <button type="submit">Unlock Gate</button>
        </form>
    </div>
</body>
</html>
