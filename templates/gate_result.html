<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: white; }
        .bg-green { background-color: #28a745; }
        .bg-red { background-color: #dc3545; }
        .icon { font-size: 5rem; margin-bottom: 20px; }
        h1 { font-size: 2.5rem; text-transform: uppercase; margin: 0; line-height: 1; }
        h2 { font-weight: 400; margin-top: 10px; opacity: 0.9; }
        .btn { margin-top: 40px; padding: 15px 40px; background: rgba(0,0,0,0.2); color: white; text-decoration: none; border-radius: 50px; font-weight: bold; border: 2px solid rgba(255,255,255,0.5); display: inline-block; }
    </style>
</head>
<body class="{% if color == 'green' %}bg-green{% else %}bg-red{% endif %}">
    <div class="icon">{% if color == 'green' %} ✔ {% else %} ✖ {% endif %}</div>
    <h1>{{ message }}</h1>
    {% if guest %}
        <h2>{{ guest }}</h2>
        <p>{{ ticket_type }}</p>
    {% endif %}
    <a href="/" class="btn">Scan Next</a>
</body>
</html>
